<script>
/* EarnMini add-on: Gift + জয়ের coin বিজ্ঞাপনের পর। index.html এর </body> এর ঠিক আগে বসান */
(()=>{
const r0=rpc;
rpc=async function(f,a,q){const d=await r0(f,a,q);if(d&&d.pend)S.hold={pend:d.pend,amt:d.hold};return d};
const p0=popup;
popup=function(ok,title,amt,sub,ad){const hd=S.hold;S.hold=null;p0(ok,title,amt,sub,ad);
 if(hd){const b=document.querySelector('#res .rc .btn');if(b)b.insertAdjacentHTML('beforebegin',`<div class="m" style="margin-bottom:8px">জয়ের ${hd.amt} coin বিজ্ঞাপন দেখার পর যোগ হবে</div><button class="btn shine" onclick="$('#res').classList.remove('on');A.win('${hd.pend}')">${I('play')} বিজ্ঞাপন দেখে +${hd.amt} coin নিন</button>`)}};
const T={pending:'অপেক্ষমাণ',approved:'অনুমোদিত',rejected:'বাতিল'},
 hd=(t,i)=>`<div class="row" style="margin-bottom:10px"><h3 class="ttl" style="margin:0">${I(i)} ${t}</h3><button class="x" onclick="closeM()">${I('x')}</button></div>`;
Object.assign(A,{
 win:pid=>{closeM();return guard(async()=>{await rpc('win_start',{p_pend:pid});S.adErr='';
  if(await showAds(['monetag','gigapub'],1)){const r=await rpc('win_claim',{p_pend:pid});await sync();popup(true,'coin যোগ হয়েছে!',r.amount,'বিজ্ঞাপন দেখার জন্য ধন্যবাদ',false)}
  else toast('এখন বিজ্ঞাপন পাওয়া যাচ্ছে না'+(S.adErr?' ('+S.adErr+')':'')+'। হোম থেকে পরে নিন','err')})},
 pends:()=>guard(async()=>{const l=await rpc('pend_list');
  openM(hd('অপেক্ষমাণ coin','coin')+(l.length?l.map(p=>`<div class="card it" onclick="A.win('${p.id}')"><span class="ib">${I('play')}</span><div class="gx"><b>+${p.amount} coin</b><div class="m">${esc(p.kind||'')} • বিজ্ঞাপন দেখে নিন</div></div>${I('right','ch')}</div>`).join(''):'<div class="empty">কিছু অপেক্ষমাণ নেই।</div>'))}),
 gift:()=>guard(async()=>{const l=await rpc('gift_list');
  openM(hd('Gift চান','gift')+`<div class="m">অ্যাডমিনকে মেসেজ পাঠান। অনুমোদন পেলে coin যোগ হবে।</div><input id="gm" maxlength="300" placeholder="আপনার মেসেজ"><button class="btn" onclick="A.gsend()">${I('send')} অনুরোধ পাঠান</button><div style="margin-top:12px">${l.map(g=>`<div class="li"><div style="flex:1;min-width:0"><b>${esc(g.msg)}</b><div class="m">${T[g.status]||g.status}${g.amount?' • +'+g.amount+' coin':''}</div></div></div>`).join('')}</div>`)}),
 gsend:()=>guard(async()=>{const m=$('#gm').value.trim();if(!m)return toast('মেসেজ লিখুন','err');await rpc('gift_send',{msg:m});closeM();toast('অনুরোধ পাঠানো হয়েছে','ok')}),
 adm:()=>guard(async()=>{const l=await rpc('admin_gift_list');
  openM(hd('Gift অনুরোধ','gift')+`<div class="m">একবারে সর্বোচ্চ ১০০০০ coin।</div>`+(l.length?l.map(g=>`<div class="card"><b>${esc(g.name||g.user_id)}</b> <span class="badge">${T[g.status]||g.status}${g.amount?' +'+g.amount:''}</span><div class="m" style="margin:6px 0">${esc(g.msg)}</div>${g.status=='pending'?`<input id="ga${g.id}" inputmode="numeric" placeholder="coin পরিমাণ"><div class="row"><button class="btn s" onclick="A.aok(${g.id})">দিন</button><button class="btn g s" onclick="A.ano(${g.id})">বাতিল</button></div>`:''}</div>`).join(''):'<div class="empty">কোনো অনুরোধ নেই।</div>'))}),
 aok:id=>guard(async()=>{await rpc('admin_gift_send',{p_req:id,p_amount:num($('#ga'+id).value)});toast('Gift পাঠানো হয়েছে','ok');closeM();setTimeout(()=>A.adm(),300)}),
 ano:id=>guard(async()=>{await rpc('admin_gift_reject',{p_req:id});closeM();setTimeout(()=>A.adm(),300)})});
const h0=P.home,m0=P.me;
P.home=()=>{const m=S.me,c=(m.pend_n||0)>0?row('play','অপেক্ষমাণ coin: '+m.pend_sum,'বিজ্ঞাপন দেখে ব্যালেন্সে যোগ করুন','A.pends()','#fbbf24','#f97316'):'';return c+h0()};
P.me=()=>{const a='<div class="card it" onclick="A.chat()">';return m0().replace(a,row('gift','Gift চান','অ্যাডমিনের কাছে coin চান','A.gift()','#f472b6','#ec4899')+(S.adm?row('check','Admin: Gift অনুরোধ','অনুরোধ দেখুন ও coin দিন','A.adm()','#f59e0b','#ef4444'):'')+a)};
rpc('admin_check',{},true).then(d=>{S.adm=!!(d&&d.admin);render()}).catch(()=>{});
})();
</script>
