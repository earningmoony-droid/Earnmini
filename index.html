async function rpc(f,a={},q){
 if(!tg.initData){const m='Telegram Mini App এর ভেতর থেকে খুলুন (সাধারণ browser এ চলবে না)';rpc.last=m;q||toast(m,'err');throw new Error(m)}
 let data,error;try{({data,error}=await sb.functions.invoke('super-endpoint',{body:{action:f,args:a,initData:tg.initData}}))}catch(e){error=e}
 if(error){let m=error.message||'সংযোগ ব্যর্থ';const c=error.context;
  if(c&&typeof c.text==='function'){try{const t=await c.text();let j;try{j=JSON.parse(t)}catch(_){}m='['+c.status+'] '+((j&&(j.error||j.message||j.msg))||t||m)}catch(_){}}
  else if(/fetch|network/i.test(m))m='সার্ভারে পৌঁছানো যাচ্ছে না: ইন্টারনেট ও function নাম চেক করুন';
  rpc.last=m;q||toast(m,'err');throw error}
 if(data&&data.error){rpc.last=data.error;q||toast(data.error,'err');throw new Error(data.error)}
 if(data&&typeof data==='object'&&!Array.isArray(data)&&data.message&&!('error' in data)&&Object.keys(data).length===1){const m='Edge Function এ এখনো ডিফল্ট টেমপ্লেট কোড চলছে ("'+data.message+'")। code.ts এর কোড paste করে Deploy করুন।';rpc.last=m;q||toast(m,'err');throw new Error(m)}
 if(data&&data.bal!==undefined)data.bal=Number(data.bal)||0;return data}

function crDraw(t,m,crashed){const c=$('#crChart');if(!c)return;const w=c.clientWidth||300,h=190,dpr=devicePixelRatio||1;if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
 const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);const T=Math.max(8,t*1.12),M=Math.max(2,m*1.18),X=q=>14+q/T*(w-34),Y=v=>h-14-(Math.log(v)/Math.log(M))*(h-34),col=crashed?'#fb7185':'#34d399';
 x.strokeStyle='#ffffff1f';x.lineWidth=1;for(let j=1;j<4;j++){x.beginPath();x.moveTo(0,h*j/4);x.lineTo(w,h*j/4);x.stroke()}
 const st=Math.max(t/60,.05);x.beginPath();x.moveTo(X(0),Y(1));for(let q=st;q<t;q+=st)x.lineTo(X(q),Y(Math.pow(2,q/8)));x.lineTo(X(t),Y(Math.pow(2,t/8)));x.strokeStyle=col;x.lineWidth=4;x.lineCap=x.lineJoin='round';x.stroke();
 x.lineTo(X(t),h);x.lineTo(X(0),h);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');x.fillStyle=g;x.fill();
 const px=X(t),py=Y(Math.pow(2,t/8));x.beginPath();x.arc(px,py,17,0,7);x.fillStyle=col+'33';x.fill();x.beginPath();x.arc(px,py,8,0,7);x.fillStyle=col;x.fill()}
function crRun(){cancelAnimationFrame(S.crA);clearInterval(S.crT);
 const f=()=>{const c=S.cr;if(!c||c.over)return;const t=(Date.now()-c.t0)/1000,m=Math.floor(Math.pow(2,t/8)*100)/100;crDraw(t,m,false);const e=$('#crM');if(e)e.textContent=m.toFixed(2)+'x';const p=$('#crP');if(p)p.textContent='+'+Math.floor(c.bet*m);S.crA=requestAnimationFrame(f)};f();
 S.crT=setInterval(async()=>{const c=S.cr;if(!c||c.over||c.busy||S.page!=='games'||S.game!=='cr')return;try{const r=await rpc('crash_state',{p_round:c.id},true);if(S.cr!==c||c.over||c.busy)return;c.t0=Date.now()-r.t*1000;if(r.status!=='open')crFinish(c,r.crash,true,0,r.crash)}catch(e){}},1000)}

 x.clearRect(0,0,w,h);x.strokeStyle='#ffffff1f';x.lineWidth=1;for(let j=1;j<4;j++){x.beginPath();x.moveTo(0,h*j/4);x.lineTo(w,h*j/4);x.stroke()}
 const X=i=>i*(w-16)/(v.length-1),Y=p=>h-10-((p-min)/(max-min))*(h-20);

 x.beginPath();x.arc(X(v.length-1),Y(last),9,0,7);x.fillStyle=col+'33';x.fill();x.beginPath();x.arc(X(v.length-1),Y(last),4.5,0,7);x.fillStyle=col;x.fill();

 terms:()=>openM(`<div class="row" style="margin-bottom:12px"><h3 class="ttl" style="margin:0">${I('file')} Terms &amp; Conditions</h3><button class="x" onclick="closeM()">${I('x')}</button></div><div class="m" style="line-height:1.8">১. বিজ্ঞাপন সম্পূর্ণ না দেখলে coin যোগ হবে না।<br>২. একাধিক অ্যাকাউন্ট, bot বা প্রতারণা করলে অ্যাকাউন্ট বন্ধ ও ব্যালেন্স বাতিল হতে পারে।<br>৩. গেমে coin হারানোর ঝুঁকি আছে; জেতার সম্ভাবনা নিশ্চিত নয়।<br>৪. Withdraw অনুরোধ যাচাইয়ের পর প্রসেস হয়; ভুল নম্বরের দায় ব্যবহারকারীর।<br>৫. নিয়ম যেকোনো সময় পরিবর্তন হতে পারে।</div><button class="btn" onclick="closeM()">বুঝেছি</button>`),

function render(){const a=$('#app'),keep=S.keepClear?[]:['wn','wa','wq','ans'].map(i=>[i,$('#'+i)?.value]);S.keepClear=0;
 $('#hd').innerHTML=`<b>EarnMini AI</b><span class="pill">${I('coin')}<span class="bal">${S.me.bal}</span></span>`;
 try{a.innerHTML=S.ld?skel():S.err?errCard():P[S.page]()}catch(e){console.error(e);a.innerHTML=`<div class="card empty" style="margin-top:20px">${I('wifi')}<b style="color:var(--t)">কিছু একটা ভুল হয়েছে</b><div class="m" style="margin:8px 0;word-break:break-word">${esc(e.message)}</div><button class="btn" onclick="location.reload()">আবার চেষ্টা করুন</button></div>`}
 keep.forEach(([i,v])=>{const e=$('#'+i);if(e&&v)e.value=v});
 [...a.children].forEach((e,i)=>e.style.setProperty('--i',Math.min(i,8)));
 $('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${S.page==k?'on':''}" onclick="go('${k}')">${I(i)}${l}</button>`).join('');
 const g=S.page==='games'?S.game:null;if(g==='ud'){trInit();drawTrade();trLoop()}else clearInterval(trT);if(g==='sc')initScratch();
 if(g==='cr'){const c=S.cr;if(c&&c.fin){crDraw(c.fin.t,c.fin.m,c.fin.crashed);const e=$('#crM');if(e){e.textContent=c.fin.m.toFixed(2)+'x';e.classList.toggle('crash',c.fin.crashed)}}else if(!c||c.over)crDraw(.1,1,false)}
 countUp()}
function pgAnim(){const ap=$('#app');ap.classList.add('pg');clearTimeout(pgAnim.t);pgAnim.t=setTimeout(()=>ap.classList.remove('pg'),900)}
async function go(p){if(S.scPend){S.scPend=0;S.sc=null;sync().then(render)}closeM();pgAnim();S.page=p;if(p!='games')S.game=null;render();scrollTo({top:0});
 if(p=='wallet'||p=='home'){try{await sync();const h=await rpc('history');S.hist=Array.isArray(h)?h:[]}catch(e){}render()}
 if(p=='refer'){try{S.lb=await rpc('leaderboard',{},true)}catch(e){S.lb=false}render()}}
setTheme(LS.get('th')||tg.colorScheme||'dark');applyFx();initCoins();loop();pgAnim();
(async()=>{render();try{const m=await rpc('me');if(!m||m.bal===undefined){rpc.last='Edge Function ভুল উত্তর দিচ্ছে (balance নেই)। code.ts deploy করে setup.sql চালানো হয়েছে কি দেখুন।';throw new Error(rpc.last)}S.me=m;const h=await rpc('history').catch(()=>[]);S.hist=Array.isArray(h)?h:[]}catch(e){S.ld=false;S.err=rpc.last||String(e.message||e);render();return}S.ld=false;pgAnim();render()})();
